version: '3.8'

services:
  doctor-tracker-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://doctor-tracker-backend-gfj8.onrender.com/api
    container_name: doctor-tracker-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL: https://doctor-tracker-backend-gfj8.onrender.com/api
